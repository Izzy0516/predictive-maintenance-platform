name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download C-MAPSS dataset
        run: |
          mkdir -p data/raw
          curl -L -o cmapss.zip "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
          unzip -o cmapss.zip
          find . -name "CMAPSSData.zip" -exec unzip -o {} \;
          find . -name "train_FD001.txt" -exec mv {} data/raw/ \;
          find . -name "test_FD001.txt" -exec mv {} data/raw/ \;
          find . -name "RUL_FD001.txt" -exec mv {} data/raw/ \;
          ls -la data/raw/

      - name: Train model
        run: python -m src.train

      - name: Run tests
        run: pytest -v
